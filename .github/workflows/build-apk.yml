name: Build DAY17 APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack every ZIP in repo root
        run: |
          mkdir -p _unpacked
          shopt -s nullglob
          for z in *.zip; do
            echo "Unpacking $z"
            unzip -oq "$z" -d _unpacked
          done
          # ищем project.godot (в распакованном или прямо в репозитории)
          PG=$(find _unpacked -name project.godot -print -quit)
          if [ -z "$PG" ]; then PG=$(find . -name project.godot -not -path './.git/*' -print -quit); fi
          if [ -z "$PG" ]; then echo "project.godot not found"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PG")" >> $GITHUB_ENV
          echo "Project dir: $(dirname "$PG")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android export
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/DAY17.apk"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: DAY17-apk
          path: build/DAY17.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DAY17 build ${{ github.run_number }}
          files: build/DAY17.apk
